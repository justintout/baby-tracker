name: baby_tracker
description: "Track your newborn's feedings, diapers, sleep, and precious moments."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase (v4.x/6.x for Xcode 16.3 + Firebase SDK 11 compatibility)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Data Classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image Handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Testing
  mockito: ^5.4.5
  build_runner_core: ^9.0.0
  mock_web_server: ^5.0.0-nullsafety.1

flutter:
  uses-material-design: true
